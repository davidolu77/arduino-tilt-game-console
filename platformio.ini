[platformio]
default_envs = nanoatmega328new

; Most newer Nanos and many clones use the "new bootloader" profile.
; If upload still fails, try the alternate environment below.
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library

[env:nanoatmega328old]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
